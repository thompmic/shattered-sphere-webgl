<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07060B" />

    <title>Michael Thompson — Creative Developer</title>
    <meta
      name="description"
      content="Personal portfolio of Michael Thompson — web engineering, real-time 3D and interface work."
    />

    <!-- og:image is a 1200×630 render of the real scene. It is framed differently
         from the live hero on purpose: the site lets the sphere cut through the
         name, which is the whole effect in motion but leaves the wordmark
         unreadable in a static link preview. Absolute URLs are required — most
         scrapers do not resolve relative ones. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://michaelthompsondev.netlify.app/" />
    <meta property="og:title" content="Michael Thompson — Creative Developer" />
    <meta
      property="og:description"
      content="Personal portfolio — web engineering, real-time 3D and interface work."
    />
    <meta property="og:image" content="https://michaelthompsondev.netlify.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The name Michael Thompson painted in white brush strokes above a fractured red sphere in space." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://michaelthompsondev.netlify.app/og.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Manrope is the UI face (§3.4). Anton is the base for the painted name: heavy
         and condensed, which is what a loaded brush actually lays down. The brush
         character itself is generated (see src/scene/inkTexture.js) rather than taken
         from a font, because free brush faces are thin handwriting, not the heavy
         ragged strokes we want. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Anton&display=swap"
      rel="stylesheet"
    />

    <link rel="preload" as="fetch" href="/models/hero.draco.glb" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
