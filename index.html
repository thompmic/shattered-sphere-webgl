<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07060B" />

    <!-- TODO: replace with the real title/description once the copy is written, and
         set og:url + og:image after the first deploy. og:image is deliberately
         omitted rather than pointed at a file that does not exist yet. -->
    <title>Michael Thompson — Creative Developer</title>
    <meta
      name="description"
      content="Personal portfolio of Michael Thompson — web engineering, real-time 3D and interface work."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Michael Thompson — Creative Developer" />
    <meta
      property="og:description"
      content="Personal portfolio — web engineering, real-time 3D and interface work."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Manrope is the UI face (§3.4). Anton is the base for the painted name: heavy
         and condensed, which is what a loaded brush actually lays down. The brush
         character itself is generated (see src/scene/inkTexture.js) rather than taken
         from a font, because free brush faces are thin handwriting, not the heavy
         ragged strokes we want. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Anton&display=swap"
      rel="stylesheet"
    />

    <link rel="preload" as="fetch" href="/models/hero.draco.glb" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
